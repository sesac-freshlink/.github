# 서비스 레포 5개가 같이 쓰는 재사용 워크플로 (할 일 8, I-02).
# 서비스 레포의 .github/workflows/ci.yml이 부른다:
#   uses: sesac-freshlink/.github/.github/workflows/spring-build.yml@main
#
# 하는 일
#   PR, dev push: Gradle 빌드·테스트 (build 작업)
#   dev 브랜치 push(또는 dev에서 수동 실행)일 때만 이어서:
#     ECR 이미지 푸시(태그 = 커밋 7자리) → gitops envs/dev/<서비스>/values.yaml 태그 커밋 → dev ArgoCD가 배포
#   main push(release PR을 Merge commit으로 합침, 또는 main에서 수동 실행): 승격 (promote 작업, 할 일 15)
#     빌드하지 않는다. 합친 dev 커밋의 이미지(dev CI가 이미 올린 태그)가 ECR에 있는지 보고
#     gitops envs/prod/<서비스>/values.yaml 태그 커밋 → prod ArgoCD가 배포
#     → 서비스 레포에 git 태그 v<날짜>(예 v2026.10.29, 같은 날 두 번째는 v2026.10.29.2)와 GitHub Release(합친 PR 목록 자동)
#     서비스 레포 ci.yml이 contents: write를 줘야 한다(태그·Release 만들기)
#
# AWS는 GitHub OIDC로 Role freshlink-ci-ecr-push를 맡는다(저장된 AWS 키 없음). 그 Role은 서비스 레포의 dev·main 브랜치만 믿는다.
# gitops 커밋은 조직 비밀 GITOPS_DEPLOY_KEY(gitops 레포 쓰기 deploy key)로 한다.
# dev 배포·prod 승격 결과는 조직 비밀 DEPLOY_WEBHOOK_URL로 알린다(actions/notify). 서비스 레포 ci.yml의 secrets: inherit로 넘어온다.
name: spring-build

on:
  workflow_call:
    inputs:
      service:
        description: "서비스 이름 = ECR 리포지토리 = gitops envs/<env>/<서비스>. 비우면 레포 이름"
        type: string
        default: ""
      aws-role-arn:
        description: "CI가 맡는 IAM Role (infra global 출력 ci_ecr_push_role_arn)"
        type: string
        default: "arn:aws:iam::929523582720:role/freshlink-ci-ecr-push"
    secrets:
      GITOPS_DEPLOY_KEY:
        required: false
      DEPLOY_WEBHOOK_URL: # 조직 비밀. 배포 성공·실패 알림(actions/notify). 없으면 알림만 건너뛴다
        required: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    # main push·수동 실행은 승격만 한다(아래 promote). main으로 가는 PR은 여기서 빌드·테스트한다
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read   # com.freshlink:common (GitHub Packages)
      id-token: write  # AWS OIDC
    steps:
      - name: 서비스 이름과 배포 여부
        id: meta
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          REPO: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          service="${INPUT_SERVICE:-$REPO}"
          deploy=false
          if [ "$REF" = "refs/heads/dev" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            deploy=true
          fi
          {
            echo "service=${service}"
            echo "tag=${SHA:0:7}"
            echo "deploy=${deploy}"
          } >> "$GITHUB_OUTPUT"
          echo "### ${service} · ${SHA:0:7} · 배포 ${deploy}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: 빌드·테스트
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      # ------------------------------------------------------------------ 여기부터 dev 배포만
      - name: 실행 jar 고르기
        if: steps.meta.outputs.deploy == 'true'
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::실행 jar가 하나가 아니다: ${jars[*]}"
            exit 1
          fi
          mkdir -p .image
          cp "${jars[0]}" .image/app.jar

      - name: 공통 Dockerfile 받기
        if: steps.meta.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: sesac-freshlink/.github
          ref: main
          path: .freshlink-ci
          sparse-checkout: ci

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.meta.outputs.deploy == 'true'
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: steps.meta.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·푸시
        if: steps.meta.outputs.deploy == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ steps.meta.outputs.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          image="${REGISTRY}/${SERVICE}:${TAG}"
          # ECR 태그는 덮어쓸 수 없다(IMMUTABLE). 같은 커밋을 다시 돌리면 푸시를 건너뛴다
          if aws ecr describe-images --repository-name "$SERVICE" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "이미 있다: ${image}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker build --platform linux/amd64 -f .freshlink-ci/ci/spring-service.Dockerfile -t "$image" .image
          docker push "$image"
          echo "푸시: ${image}" >> "$GITHUB_STEP_SUMMARY"

      - name: gitops 받기
        if: steps.meta.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: sesac-freshlink/gitops
          ref: main
          path: .gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: gitops dev 태그 커밋
        if: steps.meta.outputs.deploy == 'true'
        working-directory: .gitops
        env:
          SERVICE: ${{ steps.meta.outputs.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          file="envs/dev/${SERVICE}/values.yaml"
          [ -f "$file" ] || { echo "::error::${file}이 gitops에 없다"; exit 1; }
          git config user.name "freshlink-ci"
          git config user.email "freshlink-ci@users.noreply.github.com"
          # 서비스 여러 개가 동시에 커밋할 수 있다. 밀리면 받아서 다시 바꾸고 다시 push한다
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # yq -i는 빈 줄을 지워 diff가 커지므로 sed로 그 줄만 바꾸고 yq로 확인한다
            sed -i -E "s/^(  tag: )\"[^\"]*\"/\1\"${TAG}\"/" "$file"
            [ "$(yq '.image.tag' "$file")" = "$TAG" ] || { echo "::error::${file}의 image.tag를 바꾸지 못했다"; exit 1; }
            if git diff --quiet; then
              echo "이미 ${TAG}다" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -am "chore(${SERVICE}): image ${TAG}"
            if git push origin HEAD:main; then
              echo "gitops 커밋: ${file} → ${TAG}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::gitops push가 계속 실패했다"
          exit 1

      # dev 배포(dev push·수동 실행)일 때만 성공·실패를 알린다. PR 빌드는 알리지 않는다
      - name: 배포 알림
        if: always() && steps.meta.outputs.deploy == 'true'
        uses: sesac-freshlink/.github/actions/notify@main
        with:
          webhook-url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "${{ steps.meta.outputs.service }} dev 배포"
          commit: ${{ steps.meta.outputs.tag }}

  # ------------------------------------------------------------------ prod 승격 (main)
  # dev에서 시험한 바로 그 이미지를 prod에 올린다. 다시 빌드하면 의존성·베이스 이미지가 달라질 수 있다.
  promote:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 서비스 레포에 태그·GitHub Release 만들기
      id-token: write  # AWS OIDC (ECR 이미지 확인만)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # 합친 커밋과 그 부모들

      # release PR은 Merge commit으로 합친다(gitops README 4-2). 그러면 main 커밋의 두 번째 부모가 합친 dev 커밋이고,
      # 그 커밋의 7자리가 dev CI가 올린 이미지 태그다. 두 번째 부모가 없으면(main에 바로 push·fast-forward) main 커밋 자체를 본다.
      - name: 올릴 태그 고르기
        id: meta
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          REPO: ${{ github.event.repository.name }}
        run: |
          service="${INPUT_SERVICE:-$REPO}"
          if src=$(git rev-parse -q --verify 'HEAD^2'); then
            how="합친 dev 커밋(main ${GITHUB_SHA:0:7}의 두 번째 부모)"
          else
            src=$(git rev-parse HEAD)
            how="main 커밋 자체(Merge commit이 아님)"
          fi
          tag="${src:0:7}"
          {
            echo "service=${service}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "### ${service} prod 승격 · ${tag} · ${how}" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: dev 이미지가 ECR에 있는지
        env:
          SERVICE: ${{ steps.meta.outputs.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! aws ecr describe-images --repository-name "$SERVICE" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "::error::ECR에 ${SERVICE}:${TAG}가 없다. dev에서 이 커밋의 CI가 끝났는지 보고, release PR은 Merge commit으로 합친다. dev CI가 끝난 뒤 main에서 ci를 수동 실행하면 다시 승격한다"
            exit 1
          fi
          echo "ECR ${SERVICE}:${TAG} 있음" >> "$GITHUB_STEP_SUMMARY"

      - name: gitops 받기
        uses: actions/checkout@v7
        with:
          repository: sesac-freshlink/gitops
          ref: main
          path: .gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: gitops prod 태그 커밋
        working-directory: .gitops
        env:
          SERVICE: ${{ steps.meta.outputs.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          file="envs/prod/${SERVICE}/values.yaml"
          [ -f "$file" ] || { echo "::error::${file}이 gitops에 없다"; exit 1; }
          git config user.name "freshlink-ci"
          git config user.email "freshlink-ci@users.noreply.github.com"
          # dev 태그 커밋과 같은 방식: 밀리면 받아서 다시 바꾸고 다시 push한다
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "s/^(  tag: )\"[^\"]*\"/\1\"${TAG}\"/" "$file"
            [ "$(yq '.image.tag' "$file")" = "$TAG" ] || { echo "::error::${file}의 image.tag를 바꾸지 못했다"; exit 1; }
            if git diff --quiet; then
              echo "prod는 이미 ${TAG}다" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -am "chore(${SERVICE}): prod image ${TAG}"
            if git push origin HEAD:main; then
              echo "gitops 커밋: ${file} → ${TAG} (prod ArgoCD가 가져간다. prod 클러스터가 꺼져 있으면 켤 때 맞춘다)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::gitops push가 계속 실패했다"
          exit 1

      # prod에 올린 시점을 버전 이름표로 남긴다. 배포와는 상관없고, 실패해도 승격은 이미 끝났다.
      # 이름은 한국 날짜 v2026.10.29. 같은 날 또 release하면 v2026.10.29.2, .3 …
      # 본문은 GitHub이 지난 Release 뒤 합쳐진 PR 목록으로 채우고, 맨 위에 prod 이미지 태그를 적는다.
      - name: 태그·GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ steps.meta.outputs.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # 이 main 커밋에 이미 Release가 있으면(수동 재실행) 다시 만들지 않는다
          git fetch --tags --quiet origin
          existing=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]{4}\.' | head -1 || true)
          if [ -n "$existing" ]; then
            echo "이미 ${existing} 이다" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="v$(TZ=Asia/Seoul date +%Y.%m.%d)"
          version="$base"; n=2
          while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
            version="${base}.${n}"; n=$((n + 1))
          done
          gh release create "$version" --target "$GITHUB_SHA" --generate-notes \
            --title "${version} prod 배포 (${SERVICE}:${TAG})" \
            --notes "prod 이미지: \`${SERVICE}:${TAG}\` (dev에서 시험한 그 이미지, gitops envs/prod/${SERVICE}/values.yaml)"
          echo "GitHub Release ${version} (이미지 ${TAG})" >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 알림
        if: always()
        uses: sesac-freshlink/.github/actions/notify@main
        with:
          webhook-url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "${{ steps.meta.outputs.service || github.event.repository.name }} prod 승격"
          commit: ${{ steps.meta.outputs.tag }}
          details: "prod 이미지 태그 = 합친 dev 커밋"
